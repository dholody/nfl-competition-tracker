name: Update NFL FPI Data

on:
  schedule:
    # Back to weekly (was briefly daily) — runs Tuesday mornings only, ahead
    # of that week's Thursday night kickoff. *-current.json still ends up
    # holding "actuals to date + forecast for what's left to play" — that
    # comes from the simulation itself (see simulate-season.mjs), not from
    # how often this cron fires — so a single weekly run is enough to keep
    # it current for the whole week.
    #
    # 13:00 UTC ≈ 8-9am Eastern depending on DST.
    - cron: '0 13 * * 2'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab —
                          # this OVERWRITES the current week's snapshot (both
                          # *-current.json and, if that week hasn't kicked off
                          # yet, that week's archive entry) rather than adding
                          # a second one. See scripts/lib/archive-window.mjs:
                          # once a week's games have started, re-running this
                          # still refreshes *-current.json, but leaves the
                          # archive's pre-kickoff snapshot for that week alone.

permissions:
  contents: write

jobs:
  update-fpi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run FPI update script
        run: node scripts/update-fpi.mjs

      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly FPI data update"
          file_pattern: "data/*.json"
